<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=detection-map-20261008">
<title>GREAT HOLLOW ROUTER</title>
</head>
<body>
<header>
  <div class="eyebrow">NIGHTREIGN / FORSAKEN HOLLOWS</div>
  <h1>GREAT HOLLOW ROUTER</h1>
  <div class="version">大空洞 · 結晶4個回収</div>
</header>

<main>
<section id="step1" class="panel">
  <div class="step">01 / START</div>
  <h2>開始地点</h2>
  <div class="grid3">
    <button data-start="south">南</button>
    <button data-start="kaiden">カイデン兵の開始地点</button>
    <button data-start="north">教会の開始地点</button>
  </div>
</section>

<section id="detect" class="panel hidden">
  <div class="step">02 / SEED DETECTION</div>
  <div id="question"></div>
  <div class="mapWrap">
    <div class="mapControls"><span>丸で囲んだ地点 · 位置は目安</span><button id="zoomDetectMap">地図を拡大</button></div>
    <div class="mapScroll detectMapScroll"><div id="detectMapViews"></div></div>
    <div class="mapCredit">Map: Nightreign Hub / Alex0Goat・SisterNun</div>
  </div>
  <div id="answers" class="grid2"></div>
  <div id="detectNote" class="note"></div>
</section>

<section id="result" class="panel hidden">
  <div class="resultHead">
    <div>
      <div class="step">SEED</div>
      <div id="seed" class="seed">—</div>
    </div>
    <div class="remaining"><span id="remaining">4</span><small> / 4</small><br><span>残り</span></div>
  </div>

  <div class="nextBox">
    <div class="nextLabel">NEXT</div>
    <div id="next">—</div>
    <div id="nextMeta" class="muted"></div>
  </div>


  <div class="mapWrap">
    <div class="mapControls"><span>回収順の目安 · 座標未検証</span><button id="zoomMap">地図を拡大</button></div>
    <div class="mapScroll"><div id="mapViews"></div></div>
    <div class="mapCredit">Map: Nightreign Hub / Alex0Goat・SisterNun</div>
  </div>

  <div class="route" id="route"></div>
  <div id="status" class="status"></div>
  <button id="reportMismatch" class="secondary">配置が違う・結晶が見つからない</button>
  <button id="reset" class="secondary">最初から</button>
</section>

<section class="panel">
  <button id="copyDiagnostic" class="secondary">診断情報をコピー</button>
  <div id="diagnosticMessage" class="note" aria-live="polite"></div>
  <textarea id="diagnosticText" class="hidden" readonly aria-label="診断情報" style="width:100%;min-height:180px;margin-top:8px"></textarea>
</section>


</main>

<script src="app.js?v=detection-map-20261008"></script><script>if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
