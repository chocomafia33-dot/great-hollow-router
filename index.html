<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=unknown-skip-20261010">
<title>大空洞 · 結晶候補マップ</title>
</head>
<body>
<header><h1>大空洞 · 結晶候補マップ</h1></header>
<main>
<section id="step1" class="panel">
  <h2>開始地点</h2>
  <div class="grid3">
    <button data-start="south">南</button>
    <button data-start="kaiden">カイデン兵の開始地点</button>
    <button data-start="north">教会の開始地点</button>
  </div>
</section>
<section id="detect" class="panel hidden">
  <div class="questionHead"><span>配置の確認</span><button id="changeStart">開始地点を変更</button></div>
  <div id="question"></div>
  <div class="mapWrap">
    <div class="mapControls"><span>丸の地点を確認 · 位置は目安</span><button id="zoomDetectMap">拡大</button></div>
    <div class="mapScroll detectMapScroll"><div id="detectMapViews"></div></div>
  </div>
  <div id="answers" class="grid3"></div>
  <div id="detectNote" class="note" aria-live="polite"></div>
</section>
<section id="result" class="hidden">
  <div class="resultHead"><span id="seed">—</span><button id="redetect">再判定</button></div>
  <div class="mapToolbar"><div class="layerTabs" role="group" aria-label="表示する地図">
    <button id="showTop" data-zone="top" aria-pressed="true">地上</button>
    <button id="showBottom" data-zone="bottom" aria-pressed="false">地下</button>
  </div><button id="zoomMap">拡大</button></div>
  <div id="status" class="status hidden" role="status"></div>
  <div class="mapWrap resultMap"><div class="mapScroll"><div id="mapViews"></div></div></div>
  <p class="mapNote">資料上の候補・位置は目安</p>
  <p class="hintLegend"><span class="hintKey" aria-hidden="true">◇</span> 金枠：資料で開始付近に挙げられた候補</p>
</section>
<details id="otherMenu" class="otherMenu"><summary>その他</summary>
  <p class="note">全候補の存在と地点名・座標の対応は未検証です。追加配置や更新後の変更を含む全配置は保証しません。金枠も実際の移動の容易さを保証しません。</p>
  <button id="reportMismatch" class="secondary" disabled>配置が違う・結晶が見つからない</button>
  <button id="copyDiagnostic" class="secondary">診断情報をコピー</button>
  <div id="diagnosticMessage" class="note" aria-live="polite"></div>
  <textarea id="diagnosticText" class="hidden" readonly aria-label="診断情報"></textarea>
  <div class="mapCredit">Map: Nightreign Hub / Alex0Goat・SisterNun</div>
  <div class="version">unknown-skip-20261010</div>
</details>
</main>
<script src="app.js?v=unknown-skip-20261010"></script><script>if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
